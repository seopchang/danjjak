name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # .env는 저장소에 커밋하지 않으므로 여기서 Secrets로 만들어준다.
      # 이 값들이 없으면 APK가 "로컬 전용 모드"로 빌드되어 동기화가 동작하지 않는다.
      - name: Write .env from secrets
        run: |
          cat > .env <<EOF
          EXPO_PUBLIC_FIREBASE_API_KEY=${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID=${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EOF

      - name: Fail early if Firebase config is missing
        run: |
          if ! grep -q 'EXPO_PUBLIC_FIREBASE_PROJECT_ID=.\+' .env; then
            echo "::error::Firebase 설정이 비어 있습니다. 저장소 Secrets를 확인하세요."
            exit 1
          fi

      - name: Type check
        run: npx tsc --noEmit

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk vocadeck.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vocadeck-apk
          path: vocadeck.apk

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 보카덱 APK (최신)
          body: |
            최신 빌드 APK입니다. 아래 vocadeck.apk 를 폰/패드에서 받아 설치하세요.
            (설치 시 '알 수 없는 출처 허용'이 필요할 수 있습니다.)

            폰과 패드 둘 다 설치한 뒤, 각각 설정 화면에서 같은 계정으로
            로그인하고 동기화 버튼을 누르면 단어장이 합쳐집니다.
          files: vocadeck.apk
          prerelease: true
